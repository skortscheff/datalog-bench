name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parser and analysis tests
        run: npm test
      - name: History service tests
        run: npm run test:db
      - name: Build and structural checks
        run: python3 build.py
      - name: Docker images build (each runs its own tests)
        run: docker compose build
