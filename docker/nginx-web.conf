# Datalog Bench — static web service.
# Serves the single assembled HTML file plus two static ops endpoints.
# v1: no dependency to actually check, so healthz/readyz are both fixed 200s.
# Once the tiles/api services become real dependencies (Phase 3), readyz should
# become a real check instead of a static file.
server {
    listen 8080;
    server_tokens off;

    location = /healthz {
        default_type application/json;
        alias /usr/share/nginx/html/healthz;
    }

    location = /readyz {
        default_type application/json;
        alias /usr/share/nginx/html/readyz;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
    }
}
