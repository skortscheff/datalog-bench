# Datalog Bench — static web service.
# Serves the single assembled HTML file plus two static ops endpoints.
# v1: no dependency to actually check, so healthz/readyz are both fixed 200s.
# Once the tiles/api services become real dependencies (Phase 3), readyz should
# become a real check instead of a static file.
server {
    listen 8080;
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        default_type application/json;
        alias /usr/share/nginx/html/healthz;
    }

    location = /readyz {
        default_type application/json;
        alias /usr/share/nginx/html/readyz;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        # index.html is the whole app; always revalidate so a rebuild shows up.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Same-origin passthrough to the tiles service. The browser rendering
    # index.html can never reach the "tiles" hostname directly — that only
    # resolves inside the compose network — so TILE_BASE points here instead
    # of at http://tiles:8080 directly, and this forwards server-to-server
    # where Docker's DNS does work.
    # Only /tiles/{z}/{y}/{x} is forwarded; the rewrite strips the /tiles
    # prefix, and proxy_pass without a URI then sends the rewritten path.
    location ~ ^/tiles/(\d+/\d+/\d+)$ {
        limit_except GET HEAD { deny all; }
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass http://tiles:8080;
        proxy_set_header Host $host;
    }
    location /tiles/ {
        return 404;
    }

    # Same-origin passthrough to the database service, for the same reason
    # as /tiles/ above — the browser can't reach the "db" hostname directly.
    # client_max_body_size equals MAX_BODY_BYTES in db/server.mjs.
    location /api/ {
        limit_except GET POST DELETE PATCH { deny all; }
        client_max_body_size 8m;
        proxy_pass http://db:8080/;
        proxy_set_header Host $host;
        # db already sends this; avoid a duplicate header.
        proxy_hide_header X-Content-Type-Options;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
}
